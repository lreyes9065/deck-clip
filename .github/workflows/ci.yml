name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (for media integration tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run backend tests
        run: python3 -m unittest discover -s tests -v

  frontend:
    name: Frontend typecheck, tests, build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:frontend
      - run: pnpm run build
      - name: Package and verify the Decky ZIP
        run: pnpm run package:decky
      - uses: actions/upload-artifact@v4
        with:
          name: decky-clipport-zip
          path: release/*.zip
          if-no-files-found: error
